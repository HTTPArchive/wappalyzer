steps:
  # Step 1: Install dependencies
  - name: 'node:24'
    id: 'install-deps'
    entrypoint: 'npm'
    args: ['ci']

  # Step 2: Lint and validate JSON/JS files
  - name: 'node:24'
    id: 'lint-and-validate'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        npm run lint
        npm run validate

  # Step 3: Upload technology rules to BigQuery.
  # Runs on every build: load jobs are free and the tables are small, and
  # diffing HEAD^ would miss changes when several commits land in one push.
  - name: 'node:24'
    id: 'upload-to-bq'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        npm run tech_upload

  # Step 4: Incrementally sync icons to Cloud Storage.
  # Each SVG is converted to PNG via rsvg-convert (fit to 128x128) and uploaded
  # with its source file SHA-256 stored as GCS object metadata. On subsequent
  # runs, files whose hash hasn't changed are skipped automatically, and objects
  # whose source icon was removed are deleted.
  # Run `npm run sync_icons -- --all` locally to force re-sync everything.
  - name: 'node:24'
    id: 'sync-icons'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y --no-install-recommends librsvg2-bin
        npm run sync_icons

options:
  logging: CLOUD_LOGGING_ONLY
